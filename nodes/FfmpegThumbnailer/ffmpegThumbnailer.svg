      <stop stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00B894"/>
    </linearGradient>
    <linearGradient id="frame" x1="14" y1="17" x2="50" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F8F5"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#bg)"/>

  <!-- video frame -->
